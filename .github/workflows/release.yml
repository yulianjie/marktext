name: Release

on:
  push:
    tags:
      - 'v*'
  # Allow building installers on demand without creating a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            build: yarn run release:win
          - name: linux-x64
            os: ubuntu-latest
            build: yarn run release:linux
          # macOS x64 and arm64 are built on separate runners on purpose:
          # electron-builder.yml sets `npmRebuild: false`, so native modules are
          # only compiled for the host architecture. Building both arches on one
          # runner would ship the wrong native binaries for the cross arch.
          - name: mac-x64
            os: macos-13
            build: node .electron-vue/build.js && yarn electron-builder --mac --x64
          - name: mac-arm64
            os: macos-14
            build: node .electron-vue/build.js && yarn electron-builder --mac --arm64

    env:
      MARKTEXT_IS_STABLE: 1
      MARKTEXT_EXIT_ON_ERROR: 1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # No Apple Developer certificate available — don't attempt code signing.
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      # node-gyp's bundled gyp imports Python's distutils, which was removed in
      # Python 3.12. Pin 3.11 so electron-rebuild can build the native modules.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        #                         electron-builder                 | keyboard-layout         | keytar                      | fontmanager     | RPM
        run: |
          sudo apt-get -y update
          sudo apt-get install -y icnsutils graphicsmagick xz-utils libx11-dev libxkbfile-dev gnome-keyring libsecret-1-dev libfontconfig-dev rpm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          # Non-existent paths for the current OS are skipped by the cache action.
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ${{ env.LOCALAPPDATA }}\electron\Cache
            ${{ env.LOCALAPPDATA }}\electron-builder\cache
          key: ${{ matrix.name }}-electron-cache-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ matrix.name }}-electron-cache-

      # Some public git dependencies (e.g. file-icons) resolve to git+ssh URLs,
      # which fail on CI runners that have no SSH key. Rewrite GitHub SSH to HTTPS.
      - name: Use HTTPS for GitHub git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
        shell: bash

      - name: Install dependencies
        run: yarn install --check-files --frozen-lockfile

      - name: Strip ripgrep (Linux)
        if: runner.os == 'Linux'
        run: strip node_modules/vscode-ripgrep/bin/rg

      - name: Build installers
        run: ${{ matrix.build }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marktext-${{ matrix.name }}
          path: |
            build/*.exe
            build/*.dmg
            build/*.zip
            build/*.AppImage
            build/*.deb
            build/*.rpm
            build/*.tar.gz
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only publish a release when the workflow was triggered by a version tag.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
